  <circle cx="80" cy="80" r="7" fill="#1E293B"/>

  <!-- Top-right -->
  <circle cx="432" cy="80" r="20" fill="#22D3EE"/>
  <circle cx="432" cy="80" r="7" fill="#1E293B"/>

