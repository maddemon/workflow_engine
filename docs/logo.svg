  <path d="M80 100 L80 180 L160 260 L80 340 L80 412" stroke="url(#g)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top path -->
  <path d="M100 80 L256 80" stroke="url(#g)" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Right side path -->
